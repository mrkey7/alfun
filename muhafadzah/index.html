<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172554">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(() => {
    const token = new URLSearchParams(location.search).get("_fresh");
    const tautan = document.createElement("link");
    tautan.rel = "stylesheet";
    tautan.href = "./gaya.css" + (token ? "?_fresh=" + encodeURIComponent(token) : "");
    document.head.appendChild(tautan);
})();
</script>
<title>Muhafadzah · Alfiyyah</title>
</head>
<body>
<main class="halaman-muhafadzah">
    <header class="kepala-halaman">
        <a class="tombol-beranda" href="../index.html" aria-label="Beranda">‹</a>
        <button class="tombol-harakat" id="tombolHarakat" type="button" aria-pressed="true" aria-label="Ubah tampilan harakat">حَرَكَات</button>
    </header>
    <section class="daftar-bait" id="daftarBait" aria-live="polite"></section>
    <p class="catatan-halaman" id="statusPemuatan" role="status" aria-live="polite"></p>
</main>
<script>
(() => {
    const token = new URLSearchParams(location.search).get("_fresh");
    const suffix = token ? "?_fresh=" + encodeURIComponent(token) : "";
    const beranda = document.querySelector(".tombol-beranda");
    if (token && beranda) {
        const alamat = new URL(beranda.href);
        alamat.searchParams.set("_fresh", token);
        beranda.href = alamat.href;
    }

    ["../global/teks.js", "./app.js"].forEach(alamat => {
        const skrip = document.createElement("script");
        skrip.src = alamat + suffix;
        skrip.async = false;
        document.body.appendChild(skrip);
    });
})();
</script>
</body>
</html>
