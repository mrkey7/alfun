<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#172554">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Aset CSS memakai token unik setelah tombol R agar cache HTTP tidak dipakai. -->
<script>
(() => {
    const token = new URLSearchParams(location.search).get("_fresh");
    const suffix = token ? "?_fresh=" + encodeURIComponent(token) : "";
    [
        "./gaya/dasar.css",
        "./gaya/potret-sempit.css",
        "./gaya/potret-lebar.css",
        "./gaya/landskap-pendek.css",
        "./gaya/landskap-tinggi.css"
    ].forEach(alamat => {
        const tautan = document.createElement("link");
        tautan.rel = "stylesheet";
        tautan.href = alamat + suffix;
        document.head.appendChild(tautan);
    });
})();
</script>
<title>Alfiyyah - Belajar Alfiyyah Ibnu Malik</title>
</head>
<body>
<main class="wadah-aplikasi">

             <button class="mode-arab" id="modeArab" type="button">

</button>

                        <button class="tombol-bagian" data-bagian="tsani" type="button" disabled><strong lang="ar">الجزء الثاني</strong><span>(٣٣٢-٦٧٥)</span></button>

        </div>
        <footer class="kaki-beranda"><span>ALFIYYAH · ©2026 mr.key7@gmail.com Tebuireng3</span><button class="tombol-hapus-tembolok" id="tombolAturUlangTembolok" type="button" aria-label="Reset cache" title="Reset cache">R</button></footer>
    </section>

    </main>
<script>
(() => {
    const token = new URLSearchParams(location.search).get("_fresh");
    const skrip = document.createElement("script");
    skrip.src = "./halaman-pembuka/app.js" +
        (token ? "?_fresh=" + encodeURIComponent(token) : "");
